name: Scheduled public source review

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-lifecycle-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore most recent branch state
        uses: actions/cache/restore@v4
        with:
          path: .radar/state.json
          key: radar-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-state-${{ github.ref_name }}-
      - name: Install public collector
        run: python -m pip install --no-deps -e .
      - name: Collect official sources
        id: collect
        continue-on-error: true
        run: radar collect --state .radar/state.json --watchlist watchlist.json --out reports
      - name: Upload state for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-state-${{ github.run_id }}
          path: .radar/state.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload reports even when collection reports findings or errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 90
      - name: Validate state for cache
        id: validate-state
        if: always()
        continue-on-error: true
        run: |
          python -c "from pathlib import Path; from model_lifecycle_radar.state import load_state; p = Path('.radar/state.json'); assert p.is_file(), 'state file missing'; load_state(p)"
      - name: Save validated branch state
        if: always() && steps.validate-state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .radar/state.json
          key: radar-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Propagate collection status
        if: steps.collect.outcome != 'success'
        run: exit 1
